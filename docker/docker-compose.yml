services:
  postgres:
    image: postgres:16-alpine
    container_name: nfl-analytics-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nfl_analytics}
      POSTGRES_USER: ${POSTGRES_USER:-nfl_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nfl_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nfl_user} -d ${POSTGRES_DB:-nfl_analytics}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file:
      - ../.env
    environment:
      POSTGRES_HOST: postgres
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    env_file:
      - ../.env
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
      VITE_LOG_LEVEL: ${VITE_LOG_LEVEL:-info}
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
